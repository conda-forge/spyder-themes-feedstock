schema_version: 1

context:
  version: "1.0.7"

package:
  name: spyder-themes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spyder-themes/spyder_themes-${{ version }}.tar.gz
  sha256: 9e0d76234d6607f903d3c011bd64b5cc0dd407b0b80fe9b96840fec4f4b2dfc6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - spyder_themes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Collection of themes for Spyder IDE
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/spyder-themes/

extra:
  recipe-maintainers:
    - conradolandia
    - ccordoba12
    - dalthviz
